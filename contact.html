<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website | Contact</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; background: #f4f4f4; color: #333; }
        header { background: #35424a; color: #fff; padding: 20px 0; border-bottom: #e8491d 3px solid; }
        .container { width: 80%; margin: auto; overflow: hidden; }
        nav { float: right; margin-top: 10px; }
        nav a { color: #fff; text-decoration: none; text-transform: uppercase; font-size: 16px; margin-left: 20px; }
        nav a:hover, nav a.active { color: #e8491d; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #e8491d; color: #fff; padding: 10px 20px; border: 0; cursor: pointer; border-radius: 4px; }
        button:hover { background: #35424a; }
        .form-col { background: #fff; padding: 30px; margin-top: 20px; border-radius: 5px; }
        footer { padding: 20px; margin-top: 20px; color: #fff; background-color: #e8491d; text-align: center; clear: both; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 style="margin:0; float:left;">Modern Web</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html">Portfolio</a>
                <a href="contact.html" class="active">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-col">
            <h2>Contact Us</h2>
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="Your Message" rows="5" required></textarea>
                </div>
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>

    <footer>
        <p>Modern Web Design, Copyright &copy; 2026</p>
    </footer>
</body>
</html>
