<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website | Portfolio</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 0; padding: 0; background: #f4f4f4; color: #333; }
        header { background: #35424a; color: #fff; padding: 20px 0; border-bottom: #e8491d 3px solid; }
        .container { width: 80%; margin: auto; overflow: hidden; }
        nav { float: right; margin-top: 10px; }
        nav a { color: #fff; text-decoration: none; text-transform: uppercase; font-size: 16px; margin-left: 20px; }
        nav a:hover, nav a.active { color: #e8491d; font-weight: bold; }
        .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        .gallery-item { background: #fff; padding: 10px; border-radius: 5px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .gallery-item div { width: 100%; height: 150px; background: #ddd; display: flex; align-items: center; justify-content: center; color: #666; font-weight: bold; margin-bottom: 10px; }
        footer { padding: 20px; margin-top: 20px; color: #fff; background-color: #e8491d; text-align: center; clear: both; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1 style="margin:0; float:left;">Modern Web</h1>
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="portfolio.html" class="active">Portfolio</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h2>Our Portfolio</h2>
        <div class="gallery">
            <div class="gallery-item">
                <div>Project One</div>
                <p>E-commerce Solution</p>
            </div>
            <div class="gallery-item">
                <div>Project Two</div>
                <p>Corporate Branding</p>
            </div>
            <div class="gallery-item">
                <div>Project Three</div>
                <p>Mobile Application</p>
            </div>
        </div>
    </div>

    <footer>
        <p>Modern Web Design, Copyright &copy; 2026</p>
    </footer>
</body>
</html>
